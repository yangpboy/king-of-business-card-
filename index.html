<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>名片整合系統</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap');
      
      .serif { font-family: 'Playfair Display', serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
      .editorial-border { border-bottom: 1px solid rgba(26, 26, 26, 0.15); }
    </style>
  </head>
  <body class="bg-[#FDFCFB] text-[#1A1A1A] font-sans antialiased min-h-screen flex flex-col">
    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 z-[60] hidden flex-col items-center justify-center p-4 bg-[#1A1A1A]/80 backdrop-blur-sm">
      <div class="bg-white w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh] relative">
        <div class="px-6 py-4 editorial-border flex justify-between items-center bg-[#FAF9F6] sticky top-0 z-10">
          <h2 class="serif italic text-xl font-bold">Contact Card Info</h2>
          <button onclick="closeDetailModal()" class="opacity-50 hover:opacity-100 transition-opacity p-2 -mr-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="detail-modal-content" class="p-6 sm:p-8 overflow-y-auto flex-1">
          <!-- Content injected here -->
        </div>
        <button type="button" onclick="switchToEdit()" class="absolute bottom-5 right-5 z-20 bg-[#1A1A1A] text-white text-[11px] font-bold uppercase tracking-widest px-5 py-3 shadow-lg hover:bg-neutral-800 transition-colors">Edit Record</button>
      </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4 bg-[#1A1A1A]/50 backdrop-blur-sm">
      <div class="bg-white w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
        <div class="px-6 py-4 editorial-border flex justify-between items-center bg-[#FAF9F6]">
          <h2 class="serif italic text-xl font-bold">Edit Record</h2>
          <button onclick="closeEditModal()" class="opacity-50 hover:opacity-100 transition-opacity p-2 -mr-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="p-6 overflow-y-auto flex-1">
          <form id="edit-form" onsubmit="saveEdit(event)">
            <div id="edit-form-container"></div>
            <div class="mt-8 flex justify-end space-x-4">
              <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-[11px] mono uppercase tracking-widest opacity-60 hover:opacity-100 transition-opacity">Cancel</button>
              <button type="submit" id="save-btn" class="bg-[#1A1A1A] text-white text-[11px] font-bold uppercase tracking-widest px-6 py-3 hover:bg-neutral-800 transition-colors">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md editorial-border">
      <div class="px-6 sm:px-10 h-16 sm:h-20 flex items-center justify-between gap-4">
        <div class="flex min-w-0 items-baseline gap-4">
          <h1 class="serif text-2xl sm:text-3xl font-bold italic tracking-tight truncate">The Directory</h1>
          <span class="text-[10px] uppercase tracking-[0.2em] opacity-50 font-semibold hidden md:inline">Business Card Archive / Vol 01</span>
        </div>
        <button onclick="window.location.reload()" class="shrink-0 bg-[#1A1A1A] text-white text-[11px] font-bold uppercase tracking-widest px-4 py-2 sm:px-6 sm:py-3 hover:bg-neutral-800 transition-colors">
          <span>REFRESH</span>
        </button>
      </div>
      <div class="px-6 sm:px-10 pb-4">
        <div class="relative w-full max-w-3xl">
          <input type="text" id="search-input" placeholder="Search by name, company, title, or service..." class="w-full bg-[#FAF9F6] border border-[rgba(26,26,26,0.18)] px-4 py-3 pr-11 text-sm focus:outline-none focus:border-[#1A1A1A] placeholder:opacity-40">
          <svg class="absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 opacity-40 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
      </div>
    </header>
    
    <main class="flex-1 p-6 sm:p-10 bg-[#FAF9F6]">
      <!-- Loading State -->
      <div id="loading" class="flex flex-col items-center justify-center py-20 animate-pulse">
        <div class="h-8 w-8 border-2 border-neutral-800 border-t-transparent rounded-full animate-spin mb-4"></div>
        <span class="mono text-[11px] tracking-widest uppercase opacity-40">Loading N8N Data...</span>
      </div>

      <!-- Error State -->
      <div id="error" class="hidden max-w-2xl mx-auto mt-8 bg-red-50 border-l-4 border-red-500 p-6 rounded-md shadow-sm">
         <div class="flex items-start">
           <div class="flex-shrink-0">
             <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
               <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
             </svg>
           </div>
           <div class="ml-3">
             <p class="text-sm text-red-700" id="error-message"></p>
           </div>
         </div>
      </div>

      <!-- Data Container -->
      <div id="card-container" class="space-y-12">
        <section id="personal-section" class="hidden">
          <div class="mb-5 flex items-end justify-between gap-4 border-b border-[rgba(26,26,26,0.12)] pb-3">
            <div>
              <p class="mono text-[10px] uppercase tracking-[0.24em] opacity-40">Private Directory</p>
              <h2 class="serif text-3xl italic font-bold">My Cards</h2>
            </div>
            <span id="personal-count" class="mono text-[10px] uppercase tracking-widest opacity-40"></span>
          </div>
          <div id="personal-card-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </section>

        <section id="public-section" class="hidden">
          <div class="mb-5 flex items-end justify-between gap-4 border-b border-[rgba(26,26,26,0.12)] pb-3">
            <div>
              <p class="mono text-[10px] uppercase tracking-[0.24em] opacity-40">Public Directory</p>
              <h2 class="serif text-3xl italic font-bold">Public Cards</h2>
            </div>
            <span id="public-count" class="mono text-[10px] uppercase tracking-widest opacity-40"></span>
          </div>
          <div id="public-card-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </section>

        <div id="empty-state" class="hidden text-center text-gray-500 py-10 bg-white shadow-sm rounded-lg border border-gray-200">No cards found</div>
      </div>
    </main>

    <footer class="h-12 px-6 sm:px-10 flex items-center justify-between text-[10px] mono tracking-wider opacity-40 border-t border-[rgba(26,26,26,0.1)] bg-white">
      <div>STATUS: CONNECTED TO N8N</div>
      <div class="hidden sm:block">SYSTEM: DIGITAL CARDS</div>
    </footer>
    
    <script>
      const API_ORIGIN = window.location.protocol === 'file:' ? 'https://king-of-business-card.yangpboy.workers.dev' : window.location.origin;
      const FETCH_CARDS_URL = '/api/cards';
      const FETCH_PUBLIC_CARDS_URL = '/api/public-cards';
      const UPDATE_CARD_URL = '/api/update';

      let originalData = [];
      let personalData = [];
      let publicData = [];

      function getParamValue(params, keys) {
        for (const key of keys) {
          const value = params.get(key);
          if (value && value.trim()) return value.trim();
        }
        return '';
      }

      function getViewerId() {
        const keys = ['id', 'userId', 'userid', 'uid', 'lineId', 'lineid', ''];
        const searchParams = new URLSearchParams(window.location.search);
        const searchValue = getParamValue(searchParams, keys);
        if (searchValue) return searchValue;

        const hash = window.location.hash || '';
        const hashQuery = hash.includes('?') ? hash.slice(hash.indexOf('?')) : hash.replace(/^#/, '?');
        const hashValue = getParamValue(new URLSearchParams(hashQuery), keys);
        if (hashValue) return hashValue;

        const liffState = searchParams.get('liff.state') || searchParams.get('state') || '';
        if (liffState) {
          try {
            const decodedState = decodeURIComponent(liffState);
            const stateQuery = decodedState.includes('?') ? decodedState.slice(decodedState.indexOf('?')) : decodedState;
            const stateValue = getParamValue(new URLSearchParams(stateQuery), keys);
            if (stateValue) return stateValue;
          } catch (e) {}
        }

        return '';
      }

      function getCardsUrl() {
        const id = getViewerId();
        const url = new URL(FETCH_CARDS_URL, API_ORIGIN);
        if (id) {
          url.searchParams.set('id', id);
        }
        return url.toString();
      }

      function getPublicCardsUrl() {
        return new URL(FETCH_PUBLIC_CARDS_URL, API_ORIGIN).toString();
      }

      function normalizeWebhookPayload(data) {
        if (typeof data === 'string') {
          const trimmed = data.trim();
          if (!trimmed) return [];
          try {
            return normalizeWebhookPayload(JSON.parse(trimmed));
          } catch(e) {
            return [{ value: data }];
          }
        }

        if (Array.isArray(data)) {
          return data.map(item => {
            if (item && typeof item === 'object' && item.json && typeof item.json === 'object') {
              return item.json;
            }

            return item;
          });
        }

        if (data && !Array.isArray(data)) {
          if (Array.isArray(data.data)) return data.data;
          if (Array.isArray(data.body)) return data.body;
          if (Array.isArray(data.items)) return data.items;
          if (Array.isArray(data.records)) return data.records;
          if (data.body) return normalizeWebhookPayload(data.body);
          if (data.data) return normalizeWebhookPayload(data.data);
          if (data.json) return normalizeWebhookPayload(data.json);
          return [data];
        }

        return data || [];
      }

      async function fetchCardsFromWebhook(url = getCardsUrl(), label = 'cards') {
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`${label} server response error (${response.status})`);
        }

        const text = await response.text();
        let data = null;
        if (text && text.trim()) {
          try {
            data = JSON.parse(text);
          } catch (e) {
            throw new Error(`${label} returned non-JSON data`);
          }
        } else {
          return [];
        }

        console.log(`${label} webhook payload:`, data);
        return normalizeWebhookPayload(data);
      }

      function getParsedCard(card) {
        if (typeof card !== 'object' || card === null) {
          return { value: card };
        }

        try {
          if (typeof card.data === 'string') {
            const subParsed = JSON.parse(card.data);
            if (typeof subParsed === 'object' && subParsed !== null) {
              return { ...card, ...subParsed };
            }
          }
        } catch(e) {}

        return card;
      }

      async function refreshCards() {
        const viewerId = getViewerId();
        const requests = [
          fetchCardsFromWebhook(getPublicCardsUrl(), 'public cards').catch(err => {
            console.warn('Public cards failed:', err);
            return [];
          })
        ];

        if (viewerId) {
          requests.unshift(fetchCardsFromWebhook(getCardsUrl(), 'personal cards').catch(err => {
            console.warn('Personal cards failed:', err);
            return [];
          }));
        }

        const results = await Promise.all(requests);
        if (viewerId) {
          personalData = results[0];
          publicData = results[1];
        } else {
          personalData = [];
          publicData = results[0];
        }
        originalData = [...personalData, ...publicData];
        const searchInput = document.getElementById('search-input');
        const term = searchInput ? searchInput.value.toLowerCase() : '';
        filterAndRender(term);
      }

      async function postCardUpdate(data) {
        const payload = {
          ...currentEditCard,
          ...data
        };

        try {
          const response = await fetch(new URL(UPDATE_CARD_URL, API_ORIGIN).toString(), {
            method: 'POST',
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`更新 webhook 回應錯誤 (${response.status})`);
          }

          return response;
        } catch (err) {
          if (err.message !== 'Failed to fetch') {
            throw err;
          }

          return fetch(new URL(UPDATE_CARD_URL, API_ORIGIN).toString(), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams(payload).toString()
          });
        }
      }

      async function init() {
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const errorMsgEl = document.getElementById('error-message');
        const containerEl = document.getElementById('card-container');
        const searchInput = document.getElementById('search-input');

        if (!loadingEl || !errorEl || !containerEl) return;

        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            filterAndRender(term);
          });
        }

        try {
          await refreshCards();
          loadingEl.style.display = 'none';
        } catch (err) {
          console.error(err);
          loadingEl.style.display = 'none';
          errorEl.classList.remove('hidden');
          if (errorMsgEl) {
             errorMsgEl.innerHTML = `<strong>無法載入資料：</strong> ${err.message}<br><span class="text-sm mt-1 block opacity-80">請確認 Zeabur webhook 是否有支援 CORS，或服務是否正常運作中。</span>`;
          }
        }
      }

      function filterAndRender(term, container) {
          const filtered = originalData.filter(card => {
              // 處理物件解析邏輯（與 renderCards 一致）
              const parsedCard = getParsedCard(card);

              const name = (guessField(parsedCard, ['name', '姓名', '聯絡人', '個人名', '個人名稱', 'full_name', 'fullname', 'first_name', 'Title', 'Name', 'Display Name']) || '').toLowerCase();
              const company = (guessField(parsedCard, ['company', '公司', '公司名稱', 'organization', 'Company', 'Organization']) || '').toLowerCase();
              const jobTitle = (guessField(parsedCard, ['jobtitle', '職稱', 'position', 'role', '職位', 'Title', 'job_title', 'Job Title']) || '').toLowerCase();
              const service = (guessField(parsedCard, ['service', 'services', '服務項目', '服務', 'Service']) || '').toLowerCase();

              const cleanTerm = term.replace(/^#/, '');

              return name.includes(cleanTerm) || company.includes(cleanTerm) || jobTitle.includes(cleanTerm) || service.includes(cleanTerm);
          });

          renderCards(filtered, container);
      }

      function cardMatchesSearch(card, term) {
        const parsedCard = getParsedCard(card);
        const cleanTerm = String(term || '').replace(/^#/, '').toLowerCase();
        if (!cleanTerm) return true;

        const name = (guessField(parsedCard, ['name', '姓名', '聯絡人', '個人名', '個人名稱', 'full_name', 'fullname', 'first_name', 'Title', 'Name', 'Display Name']) || '').toLowerCase();
        const company = (guessField(parsedCard, ['company', '公司', '公司名稱', 'organization', 'Company', 'Organization']) || '').toLowerCase();
        const jobTitle = (guessField(parsedCard, ['jobtitle', '職稱', 'position', 'role', '職位', 'Title', 'job_title', 'Job Title']) || '').toLowerCase();
        const service = (guessField(parsedCard, ['service', 'services', '服務項目', '服務', 'Service']) || '').toLowerCase();

        return name.includes(cleanTerm) || company.includes(cleanTerm) || jobTitle.includes(cleanTerm) || service.includes(cleanTerm);
      }

      function renderCardSections(personalCards, publicCards) {
        const personalSection = document.getElementById('personal-section');
        const publicSection = document.getElementById('public-section');
        const personalContainer = document.getElementById('personal-card-container');
        const publicContainer = document.getElementById('public-card-container');
        const personalCount = document.getElementById('personal-count');
        const publicCount = document.getElementById('public-count');
        const emptyState = document.getElementById('empty-state');

        renderCards(personalCards, personalContainer, false);
        renderCards(publicCards, publicContainer, false);

        personalSection.classList.toggle('hidden', personalCards.length === 0);
        publicSection.classList.toggle('hidden', publicCards.length === 0);
        emptyState.classList.toggle('hidden', personalCards.length + publicCards.length > 0);

        personalCount.textContent = `${personalCards.length} cards`;
        publicCount.textContent = `${publicCards.length} cards`;
      }

      function filterAndRender(term) {
        const filteredPersonal = personalData.filter(card => cardMatchesSearch(card, term));
        const filteredPublic = publicData.filter(card => cardMatchesSearch(card, term));
        renderCardSections(filteredPersonal, filteredPublic);
      }

      function setSearchTerm(term) {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.value = term;
          filterAndRender(term.toLowerCase());
        }
      }

      // 智能推測欄位名稱 (支援中英文常見欄位)
      function guessField(item, possibleKeys) {
        for (const key of possibleKeys) {
          const match = Object.keys(item).find(k => k.toLowerCase() === key.toLowerCase());
          if (match && item[match]) return String(item[match]);
        }
        return '';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeFieldKey(key) {
        return String(key || '').toLowerCase().replace(/[\s_-]/g, '');
      }

      function isDescriptionField(key) {
        const normalized = normalizeFieldKey(key);
        return ['description', 'desc', 'summary', 'screensummary'].includes(normalized) || String(key).includes('簡述');
      }

      function isPublicField(key) {
        const normalized = normalizeFieldKey(key);
        return ['public', 'ispublic', 'visible', 'isvisible', 'published'].includes(normalized) || String(key).includes('公開');
      }

      function isImageField(key) {
        const normalized = normalizeFieldKey(key);
        return ['image', 'photo', 'avatar', 'picture', 'imageurl'].includes(normalized) || String(key).includes('圖片') || String(key).includes('照片') || String(key).includes('頭像');
      }

      function isSystemField(key) {
        const normalized = normalizeFieldKey(key);
        return normalized === 'id' || normalized === 'row_number' || normalized === 'rownumber' || normalized.includes('userid') || String(key).includes('名片id') || String(key).includes('歸屬');
      }

      function findSemanticField(item, terms) {
        const keys = Object.keys(item || {});
        const match = keys.find(key => {
          const normalized = normalizeFieldKey(key);
          return terms.some(term => normalized.includes(normalizeFieldKey(term)) || String(key).includes(term));
        });
        if (!match || item[match] === null || item[match] === undefined) return '';
        return String(item[match]);
      }

      function isTruthyValue(value) {
        const normalized = String(value || '').trim().toLowerCase();
        return ['true', '1', 'yes', 'y', 'on', '公開', '是'].includes(normalized);
      }

      function makeContactLink(key, value) {
        const label = String(value || '').trim();
        if (!label) return '';

        const normalized = normalizeFieldKey(key);
        const escapedLabel = escapeHtml(label).replace(/\n/g, '<br>');
        const hrefValue = encodeURIComponent(label);

        if (normalized.includes('email') || normalized.includes('mail') || normalized.includes('信箱')) {
          return `<a href="mailto:${escapeHtml(label)}" class="text-neutral-900 underline decoration-neutral-300 underline-offset-4 hover:decoration-neutral-900">${escapedLabel}</a>`;
        }

        if (normalized.includes('phone') || normalized.includes('mobile') || normalized.includes('tel') || normalized.includes('電話') || normalized.includes('手機')) {
          const phoneHref = label.replace(/[^\d+]/g, '');
          return `<a href="tel:${escapeHtml(phoneHref)}" class="text-neutral-900 underline decoration-neutral-300 underline-offset-4 hover:decoration-neutral-900">${escapedLabel}</a>`;
        }

        if (normalized.includes('line')) {
          const lineId = label.replace(/^@/, '');
          return `<a href="https://line.me/ti/p/~${encodeURIComponent(lineId)}" target="_blank" rel="noopener noreferrer" class="text-neutral-900 underline decoration-neutral-300 underline-offset-4 hover:decoration-neutral-900">${escapedLabel}</a>`;
        }

        if (normalized.includes('address') || normalized.includes('location') || normalized.includes('地址')) {
          return `<a href="https://www.google.com/maps/search/?api=1&query=${hrefValue}" target="_blank" rel="noopener noreferrer" class="text-neutral-900 underline decoration-neutral-300 underline-offset-4 hover:decoration-neutral-900">${escapedLabel}</a>`;
        }

        const looksLikeUrl = /^https?:\/\//i.test(label) || /^www\./i.test(label);
        const isUrlField = normalized.includes('url') || normalized.includes('website') || normalized.includes('site') || normalized.includes('facebook') || normalized.includes('instagram') || normalized.includes('linkedin') || normalized.includes('網址');
        if (looksLikeUrl || isUrlField) {
          const href = /^https?:\/\//i.test(label) ? label : `https://${label}`;
          return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" class="text-neutral-900 underline decoration-neutral-300 underline-offset-4 hover:decoration-neutral-900">${escapedLabel}</a>`;
        }

        return escapedLabel;
      }

      function renderCards(cards, container, showEmpty = true) {
        container.innerHTML = '';

        if (cards.length === 0) {
          if (!showEmpty) return;
          container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10 bg-white shadow-sm rounded-lg border border-gray-200">未取得任何名片資料</div>';
          return;
        }

        cards.forEach(card => {
          // 例外處理：若抓到的是純文字，則轉換為物件
          const parsedCard = getParsedCard(card);

          const name = guessField(parsedCard, ['name', '姓名', '聯絡人', '個人名', '個人名稱', 'full_name', 'fullname', 'first_name', 'Title', 'Name', 'Display Name']) || '未知姓名';
          const company = guessField(parsedCard, ['company', '公司', '公司名稱', 'organization', 'Company', 'Organization']) || '未知公司';
          const jobTitle = guessField(parsedCard, ['jobtitle', '職稱', 'position', 'role', '職位', 'Title', 'job_title', 'Job Title']);
          const email = guessField(parsedCard, ['email', '信箱', 'e-mail', 'mail', 'Email']);
          const phone = guessField(parsedCard, ['phone', '電話', 'mobile', 'tel', '手機', 'Phone', 'Mobile']);
          const address = guessField(parsedCard, ['address', '地址', 'location', 'Address', 'Location']);
          const image = guessField(parsedCard, ['image', 'photo', 'avatar', 'picture', 'imageUrl', '頭像', '照片', '圖片', '圖片網址', 'Avatar', 'Image']);

          const industry = guessField(parsedCard, ['industry', '行業別', '產業', 'Industry']);
          const service = guessField(parsedCard, ['service', 'services', '服務項目', '服務', 'Service']);

          const cardEl = document.createElement('div');
          cardEl.className = 'bg-white card-shadow border border-neutral-100 relative group transition-all duration-300 hover:border-neutral-300 cursor-pointer overflow-hidden flex flex-col h-full';
          
          Object.assign(cardEl, {
            onclick: () => openDetailModal(parsedCard)
          });
          
          const initial = name !== '未知姓名' ? name.charAt(0).toUpperCase() : '?';

          let html = `
            <div class="h-48 w-full bg-neutral-100 relative overflow-hidden">
              ${image ? 
                `<img src="${image}" alt="${name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">` : ''
              }
              <div class="${image ? 'hidden' : 'flex'} w-full h-full items-center justify-center text-neutral-300 font-serif italic text-6xl">
                ${initial}
              </div>
              <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-2 py-1 text-[10px] mono opacity-80 uppercase z-10 shadow-sm pointer-events-none">#CONTACT</div>
            </div>
            
            <div class="p-6 flex-1 flex flex-col relative z-10">
              <div class="flex-1 min-w-0 mb-4">
                <h3 class="serif text-2xl mb-1 italic truncate" title="${name}">${name}</h3>
                <p class="text-[10px] uppercase tracking-widest font-bold text-neutral-400 truncate" title="${jobTitle || ''}">
                  ${jobTitle ? jobTitle : 'Member'}
                </p>
              </div>
              
              <div class="space-y-2 mt-auto">
          `;

          if (company && company !== '未知公司') {
            html += `
              <div class="flex justify-between editorial-border pb-2 group/prop">
                <span class="mono text-[11px] opacity-40">C</span>
                <span class="text-xs truncate ml-4" title="${company}">${company}</span>
              </div>
            `;
          }

          if (industry) {
            html += `
              <div class="flex justify-between editorial-border pb-2 group/prop">
                <span class="mono text-[11px] opacity-40">I</span>
                <span class="text-xs truncate ml-4" title="${industry}">${industry}</span>
              </div>
            `;
          }
          
          if (service) {
            const tags = String(service).split(/[,，、\n]+|\s+和\s+|\s+及\s+/).filter(t => t.trim() !== '');
            const tagsHtml = tags.map(t => `<span class="inline-block bg-neutral-100 text-neutral-600 text-[10px] px-2 py-1 rounded-[4px] mr-1 mb-1 font-mono hover:bg-neutral-200 transition-colors cursor-pointer" onclick="event.stopPropagation(); setSearchTerm('${t.trim().replace(/'/g, "\\'")}')">#${t.trim()}</span>`).join('');
            
            html += `
              <div class="mt-2 flex flex-wrap pt-2">
                ${tagsHtml}
              </div>
            `;
          }

          html += `
              </div>
            </div>
          `;

          cardEl.innerHTML = html;
          container.appendChild(cardEl);
        });
      }

      let currentEditCard = null;
      let currentDetailCard = null;

      function legacyOpenDetailModal(cardData) {
        currentDetailCard = cardData;
        const modal = document.getElementById('detail-modal');
        const contentContainer = document.getElementById('detail-modal-content');
        
        contentContainer.innerHTML = '';
        
        const hiddenKeys = ['row_number', '名片id', '歸屬userid', 'id'];
        
        // Add image at the top if it exists
        const image = guessField(cardData, ['image', 'photo', 'avatar', 'picture', 'imageUrl', '頭像', '照片', '圖片', '圖片網址', 'Avatar', 'Image']);
        if (image) {
          contentContainer.innerHTML += `
            <div class="mb-6 flex justify-center">
              <img src="${image}" class="w-32 h-32 rounded-full object-cover border border-neutral-200 shadow-sm" onerror="this.style.display='none'">
            </div>
          `;
        }

        for (const key in cardData) {
           let val = cardData[key];
           if (typeof val === 'object') {
             try { val = JSON.stringify(val); } catch(e) {}
           }
           let valStr = String(val !== null && val !== undefined ? val : '');
           
           if (!hiddenKeys.includes(key.toLowerCase()) && key.toLowerCase() !== 'image' && key.toLowerCase() !== '圖片網址' && valStr.trim() !== '') {
             contentContainer.innerHTML += `
               <div class="mb-4 editorial-border pb-2">
                 <label class="block text-[10px] mono uppercase tracking-widest opacity-60 mb-1">${key}</label>
                 <div class="text-sm font-medium break-words text-neutral-800">${valStr.replace(/\n/g, '<br>')}</div>
               </div>
             `;
           }
        }
        
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }

      function openDetailModal(cardData) {
        currentDetailCard = cardData;
        const modal = document.getElementById('detail-modal');
        const contentContainer = document.getElementById('detail-modal-content');
        const hiddenKeys = ['row_number', 'åç‰‡id', 'æ­¸å±¬userid', 'id'];
        const name = guessField(cardData, ['name', 'å§“å', 'è¯çµ¡äºº', 'å€‹äººå', 'å€‹äººåç¨±', 'full_name', 'fullname', 'first_name', 'Title', 'Name', 'Display Name']) || 'Contact';
        const company = guessField(cardData, ['company', 'å…¬å¸', 'å…¬å¸åç¨±', 'organization', 'Company', 'Organization']);
        const jobTitle = guessField(cardData, ['jobtitle', 'è·ç¨±', 'position', 'role', 'è·ä½', 'Title', 'job_title', 'Job Title']);
        const image = guessField(cardData, ['image', 'photo', 'avatar', 'picture', 'imageUrl', 'é ­åƒ', 'ç…§ç‰‡', 'åœ–ç‰‡', 'åœ–ç‰‡ç¶²å€', 'Avatar', 'Image']);
        const displayName = name !== 'Contact' ? name : (findSemanticField(cardData, ['name', '姓名', '聯絡人', '個人名', '個人名稱', 'displayname']) || 'Contact');
        const displayCompany = company || findSemanticField(cardData, ['company', '公司', '公司名稱', 'organization']);
        const displayJobTitle = jobTitle || findSemanticField(cardData, ['jobtitle', '職稱', '職位', 'position', 'role']);
        const displayImage = image || findSemanticField(cardData, ['image', 'photo', 'avatar', 'picture', '圖片', '照片', '頭像']);
        let fieldsHtml = '';

        for (const key in cardData) {
          let val = cardData[key];
          if (typeof val === 'object') {
            try { val = JSON.stringify(val); } catch(e) {}
          }
          const valStr = String(val !== null && val !== undefined ? val : '');
          const normalizedKey = key.toLowerCase();

          if (!hiddenKeys.includes(normalizedKey) && !isSystemField(key) && !isImageField(key) && !isDescriptionField(key) && valStr.trim() !== '') {
            fieldsHtml += `
              <div class="text-center border-b border-[rgba(26,26,26,0.10)] pb-4">
                <label class="block text-[10px] mono uppercase tracking-widest opacity-45 mb-2">${escapeHtml(key)}</label>
                <div class="text-sm sm:text-base font-medium break-words text-neutral-800">${makeContactLink(key, valStr)}</div>
              </div>
            `;
          }
        }

        contentContainer.innerHTML = `
          <div class="mx-auto max-w-xl pb-16 text-center">
            ${displayImage ? `
              <div class="mb-6 flex justify-center">
                <img src="${escapeHtml(displayImage)}" class="w-32 h-32 rounded-full object-cover border border-neutral-200 shadow-sm" onerror="this.style.display='none'">
              </div>
            ` : ''}
            <h3 class="serif text-3xl sm:text-4xl italic font-bold mb-2">${escapeHtml(displayName)}</h3>
            ${displayJobTitle ? `<p class="text-[11px] uppercase tracking-[0.22em] font-bold text-neutral-400 mb-1">${escapeHtml(displayJobTitle)}</p>` : ''}
            ${displayCompany ? `<p class="text-sm text-neutral-600 mb-8">${escapeHtml(displayCompany)}</p>` : '<div class="mb-8"></div>'}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-5 text-center">
              ${fieldsHtml}
            </div>
          </div>
        `;

        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }

      function closeDetailModal() {
        const modal = document.getElementById('detail-modal');
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }

      function switchToEdit() {
        if (!currentDetailCard) return;
        closeDetailModal();
        openEditModal(currentDetailCard);
      }

      function renderEditField(key, valStr) {
        const safeKey = escapeHtml(key);
        const safeValue = escapeHtml(valStr);

        if (isPublicField(key)) {
          const checked = isTruthyValue(valStr) ? 'checked' : '';
          return `
            <div class="mb-5 flex items-center justify-between gap-4 border-b border-[rgba(26,26,26,0.12)] pb-4">
              <div>
                <label class="block text-[10px] mono uppercase tracking-widest opacity-60 mb-1">${safeKey}</label>
                <p class="text-xs text-neutral-500">Visible to others</p>
              </div>
              <label class="relative inline-flex cursor-pointer items-center">
                <input type="hidden" name="${safeKey}" value="false">
                <input type="checkbox" name="${safeKey}" value="true" class="peer sr-only" ${checked}>
                <span class="h-7 w-12 rounded-full bg-neutral-200 transition-colors peer-checked:bg-[#1A1A1A]"></span>
                <span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow-sm transition-transform peer-checked:translate-x-5"></span>
              </label>
            </div>
          `;
        }

        return `
          <div class="mb-5">
            <label class="block text-[10px] mono uppercase tracking-widest opacity-60 mb-1">${safeKey}</label>
            <input type="text" name="${safeKey}" value="${safeValue}" class="w-full border-b border-[rgba(26,26,26,0.15)] py-2 focus:outline-none focus:border-black text-sm bg-transparent transition-colors">
          </div>
        `;
      }

      function openEditModal(cardData) {
        currentEditCard = cardData;
        const modal = document.getElementById('edit-modal');
        const formContainer = document.getElementById('edit-form-container');
        
        formContainer.innerHTML = '';
        
        const hiddenKeys = ['row_number', '名片id', '歸屬userid', 'id'];
        
        for (const key in cardData) {
           let val = cardData[key];
           if (typeof val === 'object') {
             try { val = JSON.stringify(val); } catch(e) {}
           }
           let valStr = String(val !== null && val !== undefined ? val : '');
           
           if (hiddenKeys.includes(key.toLowerCase()) || isSystemField(key)) {
             formContainer.innerHTML += `<input type="hidden" name="${escapeHtml(key)}" value="${escapeHtml(valStr)}">`;
           } else {
             formContainer.innerHTML += renderEditField(key, valStr);
           }
        }
        
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }

      function closeEditModal() {
        const modal = document.getElementById('edit-modal');
        modal.classList.add('hidden');
        document.body.style.overflow = '';
        currentEditCard = null;
      }

      async function saveEdit(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const data = {};
        for (let [key, value] of formData.entries()) {
          data[key] = value;
        }
        
        const saveBtn = document.getElementById('save-btn');
        const originalText = saveBtn.innerText;
        saveBtn.innerText = 'SAVING...';
        saveBtn.disabled = true;
        saveBtn.classList.add('opacity-50');

        try {
          await postCardUpdate(data);
          
          // 更新本地資料
          const originalCardStr = JSON.stringify(currentEditCard);
          const index = originalData.findIndex(c => {
             // 嘗試對比原始資料
             const pCard = getParsedCard(c);
             return JSON.stringify(pCard) === originalCardStr || c === currentEditCard;
          });

          if (index !== -1) {
             // 用新的 data 替換，由於 n8n 的結構可能只是 flat JSON，我們用扁平結構蓋掉
             originalData[index] = data; 
          } else {
             // 如果找不到(雖然不太可能)，可以考慮加到最前面
             originalData.unshift(data);
          }

          const term = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : '';
          filterAndRender(term, document.getElementById('card-container'));

          try {
            await refreshCards();
          } catch (refreshErr) {
            console.warn('Saved, but refresh failed:', refreshErr);
          }
          
          closeEditModal();
        } catch (err) {
          if (err.message === 'Failed to fetch') {
            alert('儲存失敗：Failed to fetch。\n\n這通常是 n8n 的 CORS 限制所導致。請進入 n8n 的 Webhook 節點設定中，將「Respond to OPTIONS requests」選項打勾並重新部署。');
          } else {
            alert('儲存失敗：' + err.message);
          }
        } finally {
          saveBtn.innerText = originalText;
          saveBtn.disabled = false;
          saveBtn.classList.remove('opacity-50');
        }
      }

      window.addEventListener('load', init);
    </script>
  </body>
